name: Build Release APK and Play AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore permanent signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/natzor-lashon-release.jks

      - name: Read version
        shell: bash
        run: |
          source version.properties
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build signed Direct APK
        env:
          KEYSTORE_FILE: natzor-lashon-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleDirectRelease --stacktrace

      - name: Build Google Play AAB
        env:
          KEYSTORE_FILE: natzor-lashon-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundlePlayRelease --stacktrace

      - name: Prepare files
        run: |
          mkdir -p output
          cp app/build/outputs/apk/direct/release/app-direct-release.apk output/Natzor-Lashon-Release.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab output/Natzor-Lashon-Play.aab

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Natzor-Lashon-v${{ env.VERSION_NAME }}
          path: |
            output/Natzor-Lashon-Release.apk
            output/Natzor-Lashon-Play.aab
          retention-days: 30

      - name: Publish permanent Direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Natzor Lashon $TAG" --notes "Signed Android release"
          gh release upload "$TAG" output/Natzor-Lashon-Release.apk --clobber
