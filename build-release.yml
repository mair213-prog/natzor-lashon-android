name: Build Signed Release APK
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore permanent signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/natzor-lashon-release.jks
      - name: Build signed release APK
        env:
          KEYSTORE_FILE: natzor-lashon-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Natzor-Lashon-Release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Natzor-Lashon-Signed-Release
          path: output/Natzor-Lashon-Release.apk
          retention-days: 30
